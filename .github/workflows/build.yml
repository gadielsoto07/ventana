name: Build Kivy APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Compilar APK con Buildozer
        uses: ArtemSdm/buildozer-action@v1.2
        with:
          command: buildozer android debug
          buildozer_version: master

      - name: Subir el APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: package-apk
          path: bin/*.apk
- name: Compilar APK con Buildozer
        uses: yveskalume/action-buildozer@master
        with:
          command: buildozer android debug
